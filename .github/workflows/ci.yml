name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Base & Subproject Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f unified-ops-ax/requirements.txt ]; then pip install -r unified-ops-ax/requirements.txt; fi

      - name: Run Root & Subproject Unit Tests
        run: |
          pytest -v

      - name: Run Unified Ops AX E2E Verification
        run: |
          cd unified-ops-ax
          python verify.py
